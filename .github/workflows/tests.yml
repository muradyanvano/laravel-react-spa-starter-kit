name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  fresh-consumer:
    name: Fresh consumer export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export consumer tree from current commit
        run: |
          mkdir -p "$RUNNER_TEMP/laravel-react-spa-consumer"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/laravel-react-spa-consumer"
          echo "CONSUMER_DIR=$RUNNER_TEMP/laravel-react-spa-consumer" >> "$GITHUB_ENV"

      - name: Assert export includes documentation
        working-directory: ${{ env.CONSUMER_DIR }}
        run: |
          test -f README.md
          test -f LICENSE
          test -f NOTICE.md
          ! grep -q 'README.md export-ignore' .gitattributes

      - name: Assert Wayfinder output is absent before setup
        working-directory: ${{ env.CONSUMER_DIR }}
        run: |
          test ! -e resources/js/actions
          test ! -e resources/js/routes
          test ! -e resources/js/wayfinder
          test ! -e vendor
          test ! -e node_modules
          test ! -e .env
          test ! -e public/build

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Consumer setup
        working-directory: ${{ env.CONSUMER_DIR }}
        run: composer setup

      - name: Assert Wayfinder generated and still gitignored
        working-directory: ${{ env.CONSUMER_DIR }}
        run: |
          test -d resources/js/actions
          test -d resources/js/routes
          test -d resources/js/wayfinder
          grep -qx '/resources/js/actions' .gitignore
          grep -qx '/resources/js/routes' .gitignore
          grep -qx '/resources/js/wayfinder' .gitignore

      - name: Consumer CI checks
        working-directory: ${{ env.CONSUMER_DIR }}
        run: composer ci:check
